services:
  # Local AI inference engine for the AI Assistant / AI Inventory feature - reachable ONLY from
  # other containers on this compose network (no `ports:` mapping to the host at all, unlike
  # mongo/backend/frontend's loopback-bound ports below - Ollama's API must never be reachable
  # from outside this compose network, per the AI infra requirements). OLLAMA_HOST=0.0.0.0 is
  # required so Ollama listens on the container's internal network interface, not just its own
  # loopback - without it, `backend` couldn't reach `http://ollama:11434` at all.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          # Deliberately modest - this must fit the smallest box this stack is ever deployed to,
          # not an assumed-generous one. Docker's daemon hard-rejects a `cpus` limit above the
          # host's actual core count (a real deploy failure this stack hit on a genuinely 1-CPU
          # host), so this can never exceed what `nproc` reports on the target machine. Raise both
          # values if the deploy target has more headroom - see the model-size note in env.ts's
          # OLLAMA_MODEL comment for the RAM a given model needs.
          cpus: "0.75"
          memory: 768M

  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:5001"
    environment:
      NODE_ENV: production
      PORT: 5001
      MONGODB_URI: mongodb://mongo:27017/it_asset_management
      # Internal-network address only - reachable by this container alone, see the ollama
      # service's own comment above for why it has no host-facing port at all.
      OLLAMA_BASE_URL: http://ollama:11434
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      JWT_COOKIE_NAME: ${JWT_COOKIE_NAME:-itam_token}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-console}
      SUPERADMIN_SEED_NAME: ${SUPERADMIN_SEED_NAME:-}
      SUPERADMIN_SEED_EMAIL: ${SUPERADMIN_SEED_EMAIL:-}
      SUPERADMIN_SEED_PASSWORD: ${SUPERADMIN_SEED_PASSWORD:-}
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      - mongo
      - ollama

  frontend:
    build:
      context: ./frontend
      # NEXT_PUBLIC_* vars are inlined into the client bundle at build time, not read at
      # container runtime - they must be passed as build args, not just as `environment:` below.
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-IT Asset & License Management}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-IT Asset & License Management}
    depends_on:
      - backend

volumes:
  mongo_data:
  backend_uploads:
  ollama_data:
